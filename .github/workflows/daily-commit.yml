name: 🌿 Daily Commit

on:
  schedule:
    # Runs at 18:30 UTC = 00:00 IST (midnight India time)
    - cron: '30 18 * * *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub UI anytime

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Make daily commit
        run: |
          git config user.name "Ayush-Panchal-qw"
          git config user.email "ayushpanchal@users.noreply.github.com"

          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S')
          DAY=$(date '+%j' | sed 's/^0*//')

          # Append to commit log
          echo "[${DATE} ${TIME}]  Day ${DAY}/365 — Staying consistent. 🌿" >> commit_log.txt

          # Update last-commit line in README
          sed -i "s/\*\*Last commit:\*\*.*/\*\*Last commit:\*\* ${DATE} ${TIME}/" README.md

          git add -A
          git commit -m "🌿 Daily commit — ${DATE} (day ${DAY}/365)"
          git push

      - name: Commit success summary
        run: |
          echo "### ✅ Daily commit pushed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "- **Day of year:** $(date '+%j' | sed 's/^0*//')/365" >> $GITHUB_STEP_SUMMARY
          echo "- **Repo:** [green-streak](https://github.com/Ayush-Panchal-qw/green-streak)" >> $GITHUB_STEP_SUMMARY
