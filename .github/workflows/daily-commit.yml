name: Daily Commit

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Make daily commit
        run: |
          git config user.name "Ayush-Panchal-qw"
          git config user.email "ayushpanchal@users.noreply.github.com"

          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S')
          DAY=$(date '+%j' | sed 's/^0*//')

          echo "[${DATE} ${TIME}]  Day ${DAY}/365 - Staying consistent." >> commit_log.txt
          sed -i "s/\*\*Last commit:\*\*.*/\*\*Last commit:\*\* ${DATE} ${TIME}/" README.md

          git add -A

          # Skip if nothing changed
          git diff --cached --quiet && echo "Nothing to commit today" && exit 0

          git commit -m "Daily commit - ${DATE} (day ${DAY}/365)"

          # Rebase against remote before pushing to avoid non-fast-forward errors
          git pull --rebase origin main
          git push origin main

      - name: Summary
        run: |
          echo "### Daily commit pushed!" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "- **Day of year:** $(date '+%j' | sed 's/^0*//')/365" >> $GITHUB_STEP_SUMMARY
